name: Arena CI

on:
  workflow_dispatch:
    inputs:
      confirm_stack_prerequisites:
        description: Confirm the self-hosted Linux x64 runner has at least 4 GiB free in .work and may start the disposable loopback Paper stack
        required: false
        default: false
        type: boolean
      confirm_acceptance_prerequisites:
        description: Confirm the self-hosted Linux x64 runner has at least 8 GiB free in .work and may run six bot clients with an automated spectator
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arena-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.work/arena/gradle
  TMPDIR: ${{ github.workspace }}/.work/tmp

jobs:
  offline-core-spec:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap the pinned TypeScript workspace
        run: ./arena bootstrap
      - name: Check compatibility documentation against locks
        run: ./arena check compatibility
      - name: Exercise build helper dispatch errors
        run: ./arena check build-script
      - name: Typecheck core and scenario compiler
        run: |
          ./arena build --package core
          ./arena build --package spec
      - name: Typecheck runner control contracts
        run: ./arena build --package control

  java-plugin:
    needs: offline-core-spec
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Paper plugin unit tests with locked Java and Gradle
        run: ./arena test --suite java --case unit
      - name: Build Paper plugin with locked Java and Gradle
        run: ./arena test --suite java --case plugin

  protocol-client:
    needs: offline-core-spec
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap the pinned TypeScript workspace
        run: ./arena bootstrap
      - name: Typecheck the Mineflayer client package
        run: ./arena build --package bots

  stack:
    if: ${{ inputs.confirm_stack_prerequisites }}
    needs: [java-plugin, protocol-client]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap the pinned TypeScript workspace
        run: ./arena bootstrap
      - name: Run the loopback Paper and two-client smoke
        run: ./arena test --suite integration --case stack

  acceptance:
    if: ${{ inputs.confirm_acceptance_prerequisites }}
    needs: [java-plugin, protocol-client]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap the pinned TypeScript workspace
        run: ./arena bootstrap
      - name: Run six-bot and automated-spectator acceptance
        run: ./arena test --suite acceptance --case hunger-six
