name: Arena CI

on:
  workflow_dispatch:
    inputs:
      confirm_stack_prerequisites:
        description: Confirm the self-hosted Linux x64 runner has at least 4 GiB free in .work, can keep Paper plus clients under 8 GiB RSS, and may start the disposable loopback Paper stack
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arena-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HOME: ${{ github.workspace }}/.work/arena/cargo
  CARGO_TARGET_DIR: ${{ github.workspace }}/.work/arena/target
  RUSTUP_HOME: ${{ github.workspace }}/.work/arena/rustup
  GRADLE_USER_HOME: ${{ github.workspace }}/.work/arena/gradle
  TMPDIR: ${{ github.workspace }}/.work/tmp

jobs:
  offline-core-spec:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain and kache
        run: sh scripts/ci-prepare-rust.sh
      - name: Fetch locked crates
        run: |
          rust_toolchain=$(awk -F '"' '$1 ~ /^rust_toolchain = / { print $2 }' versions.lock.toml)
          cargo "+$rust_toolchain" fetch --locked
      - name: Test core and specs offline
        run: |
          rust_toolchain=$(awk -F '"' '$1 ~ /^rust_toolchain = / { print $2 }' versions.lock.toml)
          cargo "+$rust_toolchain" test --locked --offline -p arena-core -p arena-spec

  java-plugin:
    needs: offline-core-spec
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Paper plugin with locked Java and Gradle
        run: ./arena test --suite java --case plugin

  protocol-client:
    needs: java-plugin
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain and kache
        run: sh scripts/ci-prepare-rust.sh
      - name: Check the pinned Azalea protocol client
        run: |
          rust_toolchain=$(awk -F '"' '$1 ~ /^rust_toolchain = / { print $2 }' versions.lock.toml)
          cargo "+$rust_toolchain" fetch --locked
          cargo "+$rust_toolchain" check --locked --offline -p arena-bots

  stack:
    if: ${{ inputs.confirm_stack_prerequisites }}
    needs: [java-plugin, protocol-client]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain and kache
        run: sh scripts/ci-prepare-rust.sh
      - name: Fetch locked crates
        run: |
          rust_toolchain=$(awk -F '"' '$1 ~ /^rust_toolchain = / { print $2 }' versions.lock.toml)
          cargo "+$rust_toolchain" fetch --locked
      - name: Run the loopback Paper and two-client smoke
        run: ./arena test --suite integration --case stack
