[workspace]
resolver = "3"
members = [
    "crates/arena-core",
    "crates/arena-spec",
    "crates/arena-bots",
    "crates/arena-runner",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
arena-core = { path = "crates/arena-core" }
arena-spec = { path = "crates/arena-spec" }
arena-bots = { path = "crates/arena-bots" }
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "0bd22cbcdd30b611b112fc1c0a3d78535fd493a1" }
eyre = "=0.6.12"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "time"] }
